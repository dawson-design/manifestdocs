# Called by release.yml after the platform builds. Uploads the bare binaries
# that `gh extension install` needs as an `artifacts-*` artifact, so dist's
# host job adds them to the release with everything else.
name: gh extension assets

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch the platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: archives
          merge-multiple: true

      - name: Name the binaries for gh
        run: sh .github/scripts/gh-extension-assets.sh archives gh-assets

      - name: Hand them to the release
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-gh-extension
          path: gh-assets/*
          if-no-files-found: error
